name: recsys

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recsys}
      POSTGRES_DB: ${POSTGRES_DB:-recsys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # No bind mounts: Docker Desktop cannot mount host paths whose folder names exceed
    # 255 bytes (long Cyrillic names). Code is baked into the image and synced by
    # `docker compose watch`; data and artifacts live in named volumes.
    volumes:
      - rawdata:/app/data
      - artifacts:/app/artifacts
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - artifacts/
            - .pytest_cache/
            - .ruff_cache/
            - "**/__pycache__/"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/requirements-dev.txt
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # rewrites() in next.config.ts are resolved at build time
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - .next/

volumes:
  pgdata:
  rawdata:
  artifacts:
