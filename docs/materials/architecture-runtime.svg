<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" fill="#16161a">
  <title>Архітектура системи під час роботи</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16161a"/>
    </marker>
    <style>
      .box{fill:#fafaf7;stroke:#16161a;stroke-width:2}
      .ext{fill:#ffffff;stroke:#16161a;stroke-width:1.6;stroke-dasharray:7 5}
      .zone{fill:none;stroke:#8a897f;stroke-width:1.4;stroke-dasharray:8 6}
      .h{font-weight:700;font-size:24px}
      .t{font-size:21px}
      .m{font-family:'IBM Plex Mono',Consolas,monospace;font-size:19px}
      .lb{font-family:'IBM Plex Mono',Consolas,monospace;font-size:18px}
      .zl{font-family:'IBM Plex Mono',Consolas,monospace;font-size:17px;fill:#5d5c55;letter-spacing:.06em}
      .ln{stroke:#16161a;stroke-width:2;fill:none;marker-end:url(#a)}
      .dl{stroke:#16161a;stroke-width:1.6;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}
      .sep{stroke:#c9c8c1;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1000" height="710" fill="#ffffff"/>

  <rect class="zone" x="180" y="40" width="605" height="555"/>
  <text class="zl" x="196" y="66">DOCKER COMPOSE</text>
  <rect class="zone" x="805" y="40" width="185" height="555"/>
  <text class="zl" x="821" y="66">ХОСТ</text>

  <!-- browser -->
  <rect class="box" x="10" y="110" width="140" height="120"/>
  <text class="h" x="24" y="146">Браузер</text>
  <text class="t" x="24" y="178">користувач</text>
  <text class="t" x="24" y="206">або гість</text>

  <!-- web -->
  <rect class="box" x="200" y="90" width="285" height="140"/>
  <text class="h" x="216" y="126">web · Next.js</text>
  <text class="t" x="216" y="158">сторінки, SSR</text>
  <text class="m" x="216" y="190">/api/* → api</text>
  <text class="m" x="216" y="216">порт 3000</text>

  <!-- artifacts volume -->
  <rect class="box" x="530" y="90" width="235" height="140"/>
  <text class="h" x="546" y="126">Том artifacts</text>
  <text class="t" x="546" y="158">моделі ALS</text>
  <text class="m" x="546" y="188">als_*.npz</text>
  <text class="t" x="546" y="216">звіти оцінювання</text>

  <!-- api -->
  <rect class="box" x="200" y="290" width="285" height="250"/>
  <text class="h" x="216" y="326">api · FastAPI</text>
  <text class="t" x="216" y="358">ендпоінти, сесії</text>
  <text class="t" x="216" y="386">гібрид, RRF</text>
  <text class="t" x="216" y="414">перевірка JSON</text>
  <line class="sep" x1="216" y1="430" x2="469" y2="430"/>
  <text class="t" x="216" y="460">у пам'яті: ALS,</text>
  <text class="t" x="216" y="488">клієнт Ollama,</text>
  <text class="t" x="216" y="516">блокування запитів</text>

  <!-- db -->
  <rect class="box" x="530" y="290" width="235" height="250"/>
  <text class="h" x="546" y="326">db · PostgreSQL</text>
  <text class="t" x="546" y="356">+ pgvector</text>
  <text class="m" x="546" y="388">items.embedding</text>
  <text class="t" x="546" y="414">1024, індекс HNSW</text>
  <text class="m" x="546" y="446">ratings</text>
  <text class="m" x="546" y="472">interactions</text>
  <text class="m" x="546" y="498">users</text>
  <text class="m" x="546" y="524">llm_cache</text>

  <!-- ollama -->
  <rect class="box" x="820" y="290" width="155" height="160"/>
  <text class="h" x="834" y="326">Ollama</text>
  <text class="m" x="834" y="358">qwen3:8b</text>
  <text class="t" x="834" y="390">перерангу-</text>
  <text class="t" x="834" y="416">вання,</text>
  <text class="t" x="834" y="442">пояснення</text>

  <!-- CDN -->
  <rect class="ext" x="10" y="625" width="475" height="75"/>
  <text class="h" x="26" y="656">CDN TMDB і Open Library</text>
  <text class="t" x="26" y="686">зображення обкладинок</text>

  <!-- arrows -->
  <path class="ln" d="M150 160 H198"/>
  <path class="ln" d="M342 230 V288"/>
  <text class="lb" x="352" y="266">/api/*</text>
  <path class="ln" d="M485 415 H528"/>
  <text class="lb" x="487" y="404">SQL</text>
  <path class="ln" d="M647 230 V256 H420 V288"/>
  <text class="lb" x="436" y="250">ALS при старті</text>
  <path class="ln" d="M342 540 V560 H897 V452"/>
  <text class="lb" x="520" y="586">HTTP host.docker.internal</text>
  <path class="dl" d="M80 230 V623"/>
  <text class="lb" x="92" y="610">&lt;img&gt;</text>
</svg>
